name: Refresh Bilibili videos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Bilibili feed
        run: node scripts/fetch-videos.mjs

      - name: Commit snapshot
        run: |
          git config user.name "Blue Moon Bot"
          git config user.email "blue-moon-bot@users.noreply.github.com"
          git add videos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Bilibili videos"
          git push
